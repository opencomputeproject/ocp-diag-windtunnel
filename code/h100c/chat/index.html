<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H100 Chat</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --txt: #e6e8ee; --muted: #8b93a3; --accent: #4f8cff; --user: #26304a;
    --danger: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--txt);
  }
  /* sidebar */
  #sidebar {
    width: 280px; min-width: 280px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  #sidebar header { padding: 12px; border-bottom: 1px solid var(--line); }
  #new { width: 100%; padding: 10px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  #new:hover { filter: brightness(1.1); }
  #threads { flex: 1; overflow-y: auto; padding: 6px; }
  .thread { display: flex; align-items: center; gap: 6px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; color: var(--txt); }
  .thread:hover { background: var(--panel2); }
  .thread.active { background: var(--panel2); outline: 1px solid var(--line); }
  .thread .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .thread .del { opacity: 0; color: var(--muted); border: 0; background: none;
    cursor: pointer; font-size: 15px; padding: 2px 4px; }
  .thread:hover .del { opacity: 1; }
  .thread .del:hover { color: var(--danger); }
  #sidebar footer { padding: 10px 12px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); }
  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; }
  #topbar h1 { font-size: 14px; margin: 0; flex: 1; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  select, label.toggle { font-size: 13px; color: var(--txt); }
  select { background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; }
  label.toggle { color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 14px; }
  .msg { max-width: 820px; width: fit-content; padding: 11px 14px;
    border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--panel2); }
  .msg.error { align-self: center; background: #3a1e22; color: var(--danger);
    border: 1px solid var(--danger); font-size: 13px; }
  .artifact { align-self: flex-start; margin-top: -6px; display: inline-flex;
    align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--accent); color: var(--accent);
    text-decoration: none; font-weight: 600; font-size: 13px; width: fit-content; }
  .artifact:hover { background: var(--accent); color: #fff; }
  #empty { margin: auto; color: var(--muted); text-align: center; }
  #composer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    font: inherit; max-height: 200px; }
  #send { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <aside id="sidebar">
    <header><button id="new">+ New chat</button></header>
    <div id="threads"></div>
    <footer id="meta">endpoint: …</footer>
  </aside>
  <section id="main">
    <div id="topbar">
      <h1 id="title">H100 Chat</h1>
      <label class="toggle"><input type="checkbox" id="answersOnly" /> answers only</label>
      <select id="export" title="Download this conversation">
        <option value="">Export ▾</option>
        <option value="md">Markdown (.md)</option>
        <option value="pdf">PDF (.pdf)</option>
        <option value="pptx">PowerPoint (.pptx)</option>
      </select>
      <label class="toggle"><input type="checkbox" id="hideThink" checked /> hide thinking</label>
      <select id="model"></select>
    </div>
    <div id="log"><div id="empty">Start a new chat or pick one on the left.</div></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Message…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
  </section>

<script>
const $ = s => document.querySelector(s);
const threadsEl = $("#threads"), logEl = $("#log"), titleEl = $("#title");
const modelSel = $("#model"), metaEl = $("#meta"), inputEl = $("#input");
const sendBtn = $("#send"), hideThink = $("#hideThink");
let current = null, streaming = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.status === 204 ? null : r.json();
}

async function loadModels() {
  const d = await api("/api/models");
  modelSel.innerHTML = "";
  (d.models || []).forEach(m => {
    const o = document.createElement("option"); o.value = m; o.textContent = m;
    modelSel.appendChild(o);
  });
  if (!d.models || !d.models.length) {
    const o = document.createElement("option");
    o.textContent = "(no model served)"; o.value = ""; modelSel.appendChild(o);
  }
  metaEl.textContent = "endpoint: " + d.endpoint + (d.error ? " (unreachable)" : "");
}

async function loadThreads() {
  const list = await api("/api/threads");
  threadsEl.innerHTML = "";
  list.forEach(t => {
    const row = document.createElement("div");
    row.className = "thread" + (t.id === current ? " active" : "");
    row.innerHTML = `<span class="title"></span><button class="del" title="Delete">🗑</button>`;
    row.querySelector(".title").textContent = t.title;
    row.querySelector(".title").ondblclick = () => renameThread(t);
    row.querySelector(".title").onclick = () => openThread(t.id);
    row.querySelector(".del").onclick = e => { e.stopPropagation(); delThread(t.id); };
    threadsEl.appendChild(row);
  });
}

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  return d;
}

function addArtifact(afterEl, art) {
  const a = document.createElement("a");
  a.className = "artifact"; a.href = art.url; a.textContent = "⬇ Download " + art.label;
  a.setAttribute("download", "");
  afterEl.insertAdjacentElement("afterend", a);
  logEl.scrollTop = logEl.scrollHeight;
}

async function openThread(id) {
  if (streaming) return;
  current = id;
  const d = await api("/api/threads/" + id);
  titleEl.textContent = d.thread.title;
  logEl.innerHTML = "";
  d.messages.forEach(m => {
    const el = addMsg(m.role, m.content);
    (m.artifacts || []).forEach(a => addArtifact(el, a));
  });
  if (!d.messages.length) addMsg("assistant", "");
  await loadThreads();
}

async function newThread() {
  const t = await api("/api/threads", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: "{}" });
  await loadThreads(); await openThread(t.id);
  inputEl.focus();
}

async function renameThread(t) {
  const title = prompt("Rename conversation:", t.title);
  if (title == null) return;
  await api("/api/threads/" + t.id, { method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }) });
  if (t.id === current) titleEl.textContent = title;
  await loadThreads();
}

async function delThread(id) {
  if (!confirm("Delete this conversation?")) return;
  await api("/api/threads/" + id, { method: "DELETE" });
  if (id === current) { current = null; logEl.innerHTML =
    '<div id="empty">Start a new chat or pick one on the left.</div>'; titleEl.textContent = "H100 Chat"; }
  await loadThreads();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  if (!current) await newThread();
  const model = modelSel.value;
  if (!model) { addMsg("error", "No model is being served on the endpoint."); return; }

  inputEl.value = ""; autosize();
  const emptyEl = $("#empty"); if (emptyEl) emptyEl.remove();
  addMsg("user", text);
  const out = addMsg("assistant", "");
  streaming = true; sendBtn.disabled = true;

  try {
    const resp = await fetch(`/api/threads/${current}/chat`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text, model, hide_thinking: hideThink.checked }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5).trim());
        if (ev.status) { out.textContent = ev.status; out.dataset.pending = "1"; logEl.scrollTop = logEl.scrollHeight; }
        else if (ev.delta) {
          if (out.dataset.pending) { out.textContent = ""; delete out.dataset.pending; }
          out.textContent += ev.delta; logEl.scrollTop = logEl.scrollHeight;
        }
        else if (ev.artifact) { addArtifact(out, ev.artifact); }
        else if (ev.error) { out.className = "msg error"; out.textContent = ev.error; }
      }
    }
  } catch (e) {
    out.className = "msg error"; out.textContent = String(e);
  } finally {
    streaming = false; sendBtn.disabled = false;
    await loadThreads(); inputEl.focus();
  }
}

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
}

$("#new").onclick = newThread;
sendBtn.onclick = send;
$("#export").onchange = e => {
  const fmt = e.target.value; e.target.value = "";
  if (!fmt) return;
  if (!current) { alert("Open or start a conversation first."); return; }
  const scope = $("#answersOnly").checked ? "assistant" : "all";
  window.open(`/api/threads/${current}/export.${fmt}?scope=${scope}`, "_blank");
};
inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

loadModels(); loadThreads();
</script>
</body>
</html>
